name: AndroidX bundle

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Compiler module ka assets folder. Agar tumhara module "app" nahi hai to yahan badlo.
  ASSETS_DIR: app/src/main/assets/androidx

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Download AndroidX libraries
        run: gradle -p androidx-bundle collectLibs --no-daemon

      - name: Copy into Compiler assets
        run: |
          rm -rf "$ASSETS_DIR"
          mkdir -p "$ASSETS_DIR"
          cp androidx-bundle/build/androidx-libs/* "$ASSETS_DIR"/
          ls -la "$ASSETS_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: androidx-libs
          path: androidx-bundle/build/androidx-libs/

      - name: Commit libs to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f "$ASSETS_DIR"
          git diff --cached --quiet || git commit -m "Update AndroidX libs"
          git push
