name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Add android.jar to assets
        run: |
          mkdir -p app/src/main/assets
          cp "$ANDROID_HOME/platforms/android-34/android.jar" app/src/main/assets/android.jar
      - name: Download aapt2 for Android
        run: |
          BASE="https://github.com/revanced/revanced-manager/raw/main/android/app/src/main/jniLibs"
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p app/src/main/jniLibs/$abi
            if curl -fL "$BASE/$abi/libaapt2.so" -o /tmp/aapt2-$abi.so; then
              mv /tmp/aapt2-$abi.so app/src/main/jniLibs/$abi/libaapt2.so
            else
              echo "WARN: aapt2 download failed for $abi"
            fi
          done
          ls -lR app/src/main/jniLibs
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aalam-Compiler-debug
          path: app/build/outputs/apk/debug/*.apk
