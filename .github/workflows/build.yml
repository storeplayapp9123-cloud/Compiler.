name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Add android.jar to assets
        run: |
          mkdir -p app/src/main/assets
          cp "$ANDROID_HOME/platforms/android-34/android.jar" app/src/main/assets/android.jar
      - name: Fix native lib names (libz.so.1 -> libz.so)
        run: |
          sudo apt-get install -y patchelf
          cd app/src/main/jniLibs/arm64-v8a
          for f in *.so; do
            for n in $(patchelf --print-needed "$f"); do
              case "$n" in
                *.so.*)
                  base="${n%%.so.*}.so"
                  echo "patch $f: $n -> $base"
                  patchelf --replace-needed "$n" "$base" "$f"
                  ;;
              esac
            done
          done
          echo "--- libaapt2.so needs:"
          patchelf --print-needed libaapt2.so
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Aalam-Compiler-debug
          path: app/build/outputs/apk/debug/*.apk
